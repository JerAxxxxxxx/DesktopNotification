name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-2025
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Set up Rust
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --component rustfmt
          rustup default stable-x86_64-pc-windows-msvc
      - name: Install frontend dependencies
        run: npm.cmd ci
      - name: Test countdowns
        run: npm.cmd run test:countdown
      - name: Build frontend
        run: npm.cmd run build
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build the portable release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $env:GITHUB_REF_NAME -cne "v$version") { throw "Tag must match the application version" }
          npm.cmd run package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $source = Get-Item src-tauri/target/release/offwork.exe
          if ($source.VersionInfo.ProductVersion -ne $version) { throw "EXE version mismatch" }
      - name: Validate release signing configuration
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          SIGNING_MODE: ${{ vars.OFFWORK_WINDOWS_SIGNING_MODE }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          SIGNPATH_SIGNER_SHA256: ${{ vars.SIGNPATH_SIGNER_SHA256 }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if ($env:SIGNING_MODE -cin @('', 'off') -or !$env:SIGNING_MODE) { return }
          if ($env:SIGNING_MODE -cne 'signpath') { throw "Invalid OFFWORK_WINDOWS_SIGNING_MODE" }
          foreach ($name in @('SIGNPATH_ORGANIZATION_ID', 'SIGNPATH_PROJECT_SLUG', 'SIGNPATH_SIGNING_POLICY_SLUG', 'SIGNPATH_ARTIFACT_CONFIGURATION_SLUG', 'SIGNPATH_API_TOKEN')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing $name" }
          }
          if ($env:SIGNPATH_SIGNER_SHA256 -notmatch '^[0-9a-fA-F]{64}$') { throw "SIGNPATH_SIGNER_SHA256 must be a 64-character hex certificate fingerprint" }
      - name: Upload unsigned EXE to the signing stage
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.OFFWORK_WINDOWS_SIGNING_MODE == 'signpath'
        id: unsigned-exe
        uses: actions/upload-artifact@v7
        with:
          name: offwork-unsigned-exe
          path: src-tauri/target/release/offwork.exe
          if-no-files-found: error
          retention-days: 1
      - name: Sign and timestamp the portable EXE
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.OFFWORK_WINDOWS_SIGNING_MODE == 'signpath'
        uses: SignPath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: 'true'
          wait-for-completion-timeout-in-seconds: '900'
          output-artifact-directory: signed-exe
      - name: Stage final portable release files
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          SIGNING_MODE: ${{ vars.OFFWORK_WINDOWS_SIGNING_MODE }}
          SIGNPATH_SIGNER_SHA256: ${{ vars.SIGNPATH_SIGNER_SHA256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:SIGNING_MODE -ceq 'signpath') {
            $source = Get-Item -LiteralPath signed-exe/offwork.exe
            $signature = Get-AuthenticodeSignature -LiteralPath $source.FullName
            if ($signature.Status -ne 'Valid' -or !$signature.SignerCertificate -or !$signature.TimeStamperCertificate) {
              throw "Signed EXE must have a valid Authenticode signature and a timestamp"
            }
            $actualCertSha256 = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($signature.SignerCertificate.RawData))
            if ($actualCertSha256 -ine $env:SIGNPATH_SIGNER_SHA256) { throw "Unexpected signing certificate" }
          } elseif ($env:SIGNING_MODE -ceq 'off' -or !$env:SIGNING_MODE) {
            $source = Get-Item -LiteralPath src-tauri/target/release/offwork.exe
          } else {
            throw "Invalid OFFWORK_WINDOWS_SIGNING_MODE"
          }
          if ($source.VersionInfo.ProductVersion -ne $version) { throw "Final EXE version mismatch" }
          New-Item -ItemType Directory -Path release-assets | Out-Null
          $name = "Offwork-$version-x64-portable.exe"
          Copy-Item $source.FullName "release-assets/$name"
          $hash = (Get-FileHash "release-assets/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content release-assets/SHA256SUMS.txt -Encoding ascii
          Copy-Item docs/使用说明.md release-assets/使用说明.md
          Copy-Item LICENSE release-assets/LICENSE.txt
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          name: portable-release
          path: release-assets/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: portable-release
          path: assets
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        working-directory: assets
        run: |
          sha256sum --check SHA256SUMS.txt
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "下班啦 $TAG" --notes "Windows x64 免安装版。下载 EXE 后双击运行，需要 Microsoft Edge WebView2 Runtime。"
          fi
          if [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" == true ]]; then
            gh release upload "$TAG" ./*.exe SHA256SUMS.txt LICENSE.txt 使用说明.md --clobber
            gh release edit "$TAG" --draft=false
          fi
